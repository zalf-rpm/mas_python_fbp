[project]
name = "zalfmas-fbp"
version = "0.2.38"
description = "lib and tooling for Cap'n Proto-based FBP flows"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Michael Berg-Mohnicke", email = "michael.berg@zalf.de" },
    { name = "Vincent Dlugosch", email = "vincent.dlugosch@zalf.de" }
]
dependencies = [
  "tomli-w>=1.2.0,<2",
  "netcdf4>=1.7.4,<2",
  "spotpy>=1.6.7,<2",
  "matplotlib>=3.11.1,<4",
  "pycapnp>=2.2.4,<3",
  "zalfmas-common>=0.1.49,<0.2",
  "zalfmas-capnp-schemas>=0.1.70,<0.2",
  "zalfmas-services>=0.1.16,<0.2",
  "pymep>=1.0.7,<2",
  "pydantic>=2.13.5,<3",
  "geojson-pydantic>=2.1.2,<3",
  "rasterio>=1.5.1,<2",
  "geopandas>=1.1.4,<2",
  "pyarrow>=25.0.1,<26",
  "duckdb>=1.5.5,<2",
  "owslib>=0.36.0,<0.37",
  "boto3>=1.43.85,<2", "gjson>=1.2.0,<2",
]

[project.scripts]
zalfmas-component-service = "zalfmas_fbp.run.local_components_service:cli"
zalfmas-channel-service = "zalfmas_fbp.run.channel_starter_service:cli"

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "ruff>=0.16.5,<0.17",
  "ty>=0.0.77,<0.0.78",
  "types-boto3[all,s3]>=1.43.85,<2",
  "basedpyright>=1.39.10,<2",
]

[tool.pixi.dependencies]
libsodium = ">=1.0.22,<2"
openpyxl = ">=3.1.5,<4"

[tool.pixi.pypi-dependencies]
zalfmas-fbp = { path = ".", editable = true }

# Referencing local packages in editable mode for pixi
#zalfmas-common = { path = "../mas_python_common", editable = true }
# zalfmas-capnp-schemas = { path = "../mas_capnproto_schemas", editable = true }

[tool.pixi.feature.dev.dependencies]
pixi-pycharm = ">=0.0.12,<0.0.13"

# Tasks belonging to the dev feature, so they run in the environment that actually has pytest,
# ruff and basedpyright. `pixi run test` finds them without needing `-e dev`.
[tool.pixi.feature.dev.tasks]
test = { cmd = "pytest" }
lint = { cmd = "ruff check ." }
format = { cmd = "ruff format ." }
format-check = { cmd = "ruff format --check ." }
typecheck = { cmd = "basedpyright" }
# Everything that is green on a clean tree, so this is usable as a gate.
# `typecheck` is deliberately not in here: basedpyright has a known baseline of pre-existing
# errors, so it would fail every time and stop the tests from running at all. Run it on its own.
check = { depends-on = ["lint", "format-check", "test"] }

[tool.pixi.environments]
dev = ["dev"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.ruff]
line-length = 120
target-version = "py312"
# The plan documents embed illustrative Python that is deliberately not formatted as source.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "T",
  "G",
  "BLE",
  "COM",
  "PTH",
  "C417",
  "TRY",
  "ASYNC109",
  # "D100",
  # "D101",
]
ignore = ["E501", "COM812"]

[tool.basedpyright]
ignore = ["tests"]
typeCheckingMode = "basic"
venvPath = ".pixi/envs"
venv = "dev"

[tool.pixi.tasks]
components-service = { cmd = "python -m zalfmas_fbp.run.local_components_service configs/local_components_service.toml" }
regenerate-components-cache = { cmd = "python -m zalfmas_fbp.run.local_components_service configs/local_components_service.toml --regenerate_cache --force" }
channel-service = { cmd = "python -m zalfmas_fbp.run.channel_starter_service configs/channel_starter_service.toml" }
run-flow = { cmd = "python -m zalfmas_fbp.run.run_fbp_flow" }
